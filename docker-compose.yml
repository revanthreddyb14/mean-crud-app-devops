version: "3.9"

services:
  mongodb:
    image: mongo:6
    container_name: mongo
    volumes:
      - mongo_data:/data/db
    networks:
      - mean_net

  backend:
    image: yourdockerhub/mean-backend:latest
    container_name: backend
    environment:
      - MONGO_URL=mongodb://mongodb:27017/meanapp
      - PORT=3000
    depends_on:
      - mongodb
    networks:
      - mean_net

  frontend:
    image: yourdockerhub/mean-frontend:latest
    container_name: frontend
    networks:
      - mean_net

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - mean_net

volumes:
  mongo_data:

networks:
  mean_net: